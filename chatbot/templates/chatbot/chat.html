{% extends 'index.html' %}
{% load markdownify %}

{% block blockname %}

<section class="messages" id="messages">
    {% for message in messages %}
    <div class="message {{ message.role }}-message">
        <br />
        {{ message.text|markdownify }}
        <span class="message-time">
            {{ message.created|date:"Y/m/d H:i" }}
        </span>
    </div>
    {% endfor %}
</section>

<form class="chat-form" id="chatForm" method="post" action="{% url 'chat' %}">
    {% csrf_token %}

    <textarea name="text" id="chatInput" class="chat-input" placeholder="پیام خود را بنویسید..." autocomplete="off"
        required rows="1"></textarea>

    <button type="submit" id="sendButton" class="send-button">
        ➤
    </button>
</form>



<style>
    .chat-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
    }

    .chat-input {
        flex: 1;
        min-height: 45px;
        max-height: 30vh;
        padding: 12px 15px;
        resize: none;
        overflow-y: hidden;
        line-height: 1.6;
        font-family: inherit;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 12px;
        outline: none;
        box-sizing: border-box;
    }

    .chat-input:focus {
        border-color: #3498db;
    }

    .send-button {
        width: 45px;
        height: 45px;
        flex-shrink: 0;
        border: none;
        border-radius: 50%;
        cursor: pointer;
    }

    .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .site-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .ai-loading {
        display: none;
        align-items: center;
        gap: 4px;
        direction: ltr;
    }

    .ai-loading.active {
        display: flex;
    }

    .ai-loading span {
        width: 6px;
        height: 6px;
        background-color: #3498db;
        border-radius: 50%;
        animation: ai-dot 1.2s infinite ease-in-out;
    }

    .ai-loading span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .ai-loading span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes ai-dot {

        0%,
        80%,
        100% {
            transform: scale(0.6);
            opacity: 0.4;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    .chat-input:read-only {
        opacity: 0.7;
    }

    .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<script>
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const sendButton = document.getElementById("sendButton");
    const aiLoading = document.getElementById("aiLoading");

    function resizeTextarea() {
        const maxHeight = window.innerHeight * 0.30;

        // ابتدا ارتفاع را به اندازه محتوای واقعی تنظیم می‌کنیم
        chatInput.style.height = "auto";

        const newHeight = Math.min(chatInput.scrollHeight, maxHeight);

        chatInput.style.height = newHeight + "px";

        // اگر از ۳۰ درصد صفحه بیشتر شد، اسکرول فعال شود
        chatInput.style.overflowY =
            chatInput.scrollHeight > maxHeight ? "auto" : "hidden";
    }

    // تغییر ارتفاع هنگام تایپ
    chatInput.addEventListener("input", resizeTextarea);

    chatInput.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") {
            return;
        }

        if (event.shiftKey) {
            // Shift + Enter: رفتن به خط بعد
            // رفتار پیش‌فرض مرورگر حفظ می‌شود
            setTimeout(resizeTextarea, 0);
            return;
        }

        // Enter معمولی: ارسال فرم
        event.preventDefault();

        if (chatForm.requestSubmit) {
            chatForm.requestSubmit();
        } else {
            chatForm.submit();
        }
    });

    chatForm.addEventListener("submit", function (event) {
        const text = chatInput.value.trim();

        if (!text) {
            event.preventDefault();
            return;
        }

        // جلوگیری از ارسال چندباره
        if (chatForm.dataset.submitting === "true") {
            event.preventDefault();
            return;
        }

        chatForm.dataset.submitting = "true";

        // اگر انیمیشن هدر دارید
        if (aiLoading) {
            aiLoading.classList.add("active");
        }

        /*
         * از disabled استفاده نکنید؛ چون مقدار فیلد ارسال نمی‌شود.
         * readonly مقدار textarea را همراه فرم ارسال می‌کند.
         */
        chatInput.readOnly = true;
        sendButton.disabled = true;
        sendButton.textContent = "⏳";
    });

    // تنظیم ارتفاع اولیه
    resizeTextarea();
</script>



{% endblock blockname %}
