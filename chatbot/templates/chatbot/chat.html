{% extends 'index.html' %}
{% load markdownify %}

{% block blockname %}

<style>
    /* هدر */
    .site-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    /* انیمیشن دریافت پاسخ */
    .ai-loading {
        display: none;
        align-items: center;
        gap: 4px;
        direction: ltr;
    }

    .ai-loading.active {
        display: flex;
    }

    .ai-loading span {
        width: 6px;
        height: 6px;
        background-color: #3498db;
        border-radius: 50%;
        animation: ai-dot 1.2s infinite ease-in-out;
    }

    .ai-loading span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .ai-loading span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes ai-dot {

        0%,
        80%,
        100% {
            transform: scale(0.6);
            opacity: 0.4;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    /* پیام‌ها */
    .message {
        direction: rtl;
        text-align: right;
        line-height: 1.9;
    }

    /* کدهای چندخطی */
    .message pre {
        direction: ltr !important;
        text-align: left !important;

        display: block;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;

        margin: 0;
        padding: 48px 16px 16px;

        overflow-x: auto;
        overflow-y: auto;

        background: #111827 !important;
        color: #f9fafb !important;

        border: 1px solid #374151;
        border-radius: 10px;

        font-family: Consolas, Monaco, "Courier New", monospace !important;
        font-size: 14px;
        line-height: 1.7;

        white-space: pre !important;
        word-break: normal !important;
        overflow-wrap: normal !important;

        unicode-bidi: isolate;
    }

    .message pre code {
        display: block;

        direction: ltr !important;
        text-align: left !important;

        margin: 0;
        padding: 0;

        background: transparent !important;
        color: inherit !important;

        font-family: Consolas, Monaco, "Courier New", monospace !important;
        font-size: inherit;
        line-height: inherit;

        white-space: pre !important;
        word-break: normal !important;
        overflow-wrap: normal !important;
    }

    /* کدهای کوتاه داخل متن */
    .message code:not(pre code) {
        direction: ltr !important;
        unicode-bidi: isolate;

        display: inline-block;
        padding: 2px 6px;

        background: #1f2937;
        color: #facc15;
        border-radius: 5px;

        font-family: Consolas, Monaco, "Courier New", monospace !important;
        font-size: 0.9em;
    }

    /* ظرف کد و دکمه کپی */
    .code-wrapper {
        position: relative;
        width: 100%;
        margin: 16px 0;
        direction: ltr;
    }

    .copy-code-button {
        position: absolute;
        top: 8px;
        right: 8px;

        direction: rtl;
        text-align: center;

        padding: 6px 10px;
        border: 1px solid #4b5563;
        border-radius: 6px;

        background: #1f2937;
        color: #e5e7eb;

        font-family: inherit;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;

        z-index: 2;
    }

    .copy-code-button:hover {
        background: #374151;
    }

    .copy-code-button.copied {
        background: #166534;
        color: #dcfce7;
    }

    /* فرم چت */
    .chat-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
    }

    .chat-input {
        flex: 1;

        min-height: 45px;
        max-height: 30vh;

        padding: 12px 15px;

        resize: none;
        overflow-y: hidden;

        line-height: 1.6;
        font-family: inherit;
        font-size: 16px;

        border: 1px solid #ccc;
        border-radius: 12px;
        outline: none;
        box-sizing: border-box;
    }

    .chat-input:focus {
        border-color: #3498db;
    }

    .chat-input:read-only {
        opacity: 0.7;
    }

    .send-button {
        width: 45px;
        height: 45px;
        flex-shrink: 0;

        border: none;
        border-radius: 50%;

        cursor: pointer;
    }

    .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<!-- اگر در index.html هدر جداگانه دارید، این بخش را داخل همان هدر قرار دهید -->
<header class="site-header">
    <h2>
        <header class="site-header">
            <div id="aiLoading" class="ai-loading" aria-label="در حال پاسخ‌گویی">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>
    </h2>

    <div id="aiLoading" class="ai-loading">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<section class="messages" id="messages">
    {% for message in messages %}
    <div class="message {{ message.role }}-message">
        {{ message.text|markdownify }}

        <span class="message-time">
            {{ message.created|date:"Y/m/d H:i" }}
        </span>
    </div>
    {% endfor %}
</section>

<form class="chat-form" id="chatForm" method="post" action="{% url 'chat' %}">
    {% csrf_token %}

    <textarea name="text" id="chatInput" class="chat-input" placeholder="پیام خود را بنویسید..." autocomplete="off"
        required rows="1"></textarea>

    <button type="submit" id="sendButton" class="send-button">
        ➤
    </button>
</form>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const sendButton = document.getElementById("sendButton");
        const aiLoading = document.getElementById("aiLoading");

        /*
         * تغییر خودکار ارتفاع textarea
         * حداکثر ارتفاع: ۳۰ درصد ارتفاع صفحه
         */
        function resizeTextarea() {
            const maxHeight = window.innerHeight * 0.30;

            chatInput.style.height = "auto";

            const newHeight = Math.min(
                chatInput.scrollHeight,
                maxHeight
            );

            chatInput.style.height = newHeight + "px";

            if (chatInput.scrollHeight > maxHeight) {
                chatInput.style.overflowY = "auto";
            } else {
                chatInput.style.overflowY = "hidden";
            }
        }

        chatInput.addEventListener("input", resizeTextarea);

        /*
         * Enter برای ارسال
         * Shift + Enter برای خط جدید
         */
        chatInput.addEventListener("keydown", function (event) {
            if (event.key !== "Enter") {
                return;
            }

            if (event.shiftKey) {
                // رفتار عادی textarea حفظ می‌شود
                setTimeout(resizeTextarea, 0);
                return;
            }

            event.preventDefault();

            if (chatForm.requestSubmit) {
                chatForm.requestSubmit();
            } else {
                chatForm.submit();
            }
        });

        /*
         * هنگام ارسال فرم
         */
        chatForm.addEventListener("submit", function (event) {
            const text = chatInput.value.trim();

            if (!text) {
                event.preventDefault();
                return;
            }

            // جلوگیری از ارسال چندباره
            if (chatForm.dataset.submitting === "true") {
                event.preventDefault();
                return;
            }

            chatForm.dataset.submitting = "true";

            // نمایش انیمیشن هدر
            if (aiLoading) {
                aiLoading.classList.add("active");
            }

            /*
             * disabled نکنید، چون مقدار textarea ارسال نمی‌شود.
             * readonly مقدار آن را همراه فرم ارسال می‌کند.
             */
            chatInput.readOnly = true;

            sendButton.disabled = true;
            sendButton.textContent = "⏳";
        });

        /*
         * اضافه‌کردن دکمه کپی به همه کدهای Markdown
         */
        const codeBlocks = document.querySelectorAll(".message pre");

        codeBlocks.forEach(function (pre) {
            // جلوگیری از اضافه‌شدن دوباره دکمه
            if (
                pre.parentElement &&
                pre.parentElement.classList.contains("code-wrapper")
            ) {
                return;
            }

            // ساخت ظرف کد
            const wrapper = document.createElement("div");
            wrapper.className = "code-wrapper";

            // قرار دادن wrapper قبل از pre
            pre.parentNode.insertBefore(wrapper, pre);

            // انتقال pre داخل wrapper
            wrapper.appendChild(pre);

            // ساخت دکمه کپی
            const copyButton = document.createElement("button");
            copyButton.type = "button";
            copyButton.className = "copy-code-button";
            copyButton.textContent = "کپی";

            wrapper.appendChild(copyButton);

            copyButton.addEventListener("click", async function () {
                const code = pre.querySelector("code");

                if (!code) {
                    return;
                }

                const codeText = code.innerText;

                try {
                    await navigator.clipboard.writeText(codeText);

                    copyButton.textContent = "کپی شد";
                    copyButton.classList.add("copied");

                    setTimeout(function () {
                        copyButton.textContent = "کپی";
                        copyButton.classList.remove("copied");
                    }, 2000);

                } catch (error) {
                    // روش جایگزین برای مرورگرهای قدیمی‌تر
                    const temporaryTextarea =
                        document.createElement("textarea");

                    temporaryTextarea.value = codeText;
                    temporaryTextarea.style.position = "fixed";
                    temporaryTextarea.style.opacity = "0";

                    document.body.appendChild(temporaryTextarea);
                    temporaryTextarea.select();

                    document.execCommand("copy");

                    temporaryTextarea.remove();

                    copyButton.textContent = "کپی شد";
                    copyButton.classList.add("copied");

                    setTimeout(function () {
                        copyButton.textContent = "کپی";
                        copyButton.classList.remove("copied");
                    }, 2000);
                }
            });
        });

        // تنظیم ارتفاع اولیه textarea
        resizeTextarea();

        // تنظیم دوباره هنگام تغییر اندازه صفحه
        window.addEventListener("resize", resizeTextarea);
    });
</script>

{% endblock blockname %}
