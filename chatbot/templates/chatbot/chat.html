{% extends 'index.html' %}
{% load markdownify %}

{% block blockname %}

<header class="site-header">
    <div id="aiLoading" class="ai-loading" aria-label="در حال پاسخ‌گویی">
        <span></span>
        <span></span>
        <span></span>
    </div>
</header>

<section class="messages" id="messages">
    {% for message in messages %}
    <div class="message {{ message.role }}-message">
        {{ message.text|markdownify }}
        <span class="message-time">
            {{ message.created|date:"Y/m/d H:i" }}
        </span>
    </div>
    {% endfor %}
</section>

<form class="chat-form" id="chatForm">
    {% csrf_token %}
    <textarea
        name="text"
        id="chatInput"
        class="chat-input"
        placeholder="پیام خود را بنویسید..."
        autocomplete="off"
        required
        rows="1"
    ></textarea>

    <button type="submit" id="sendButton" class="send-button">➤</button>
</form>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("chatInput");
const messages = document.getElementById("messages");
const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]").value;

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    const userBox = document.createElement("div");
    userBox.className = "message user-message";
    userBox.textContent = text;
    messages.appendChild(userBox);

    const aiBox = document.createElement("div");
    aiBox.className = "message assistant-message";
    aiBox.textContent = "";
    messages.appendChild(aiBox);

    input.value = "";

    const response = await fetch("{% url 'chat_stream' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken
        },
        body: JSON.stringify({ text })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let result = "";

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        result += decoder.decode(value, { stream: true });
        aiBox.textContent = result;
    }
});
</script>

{% endblock blockname %}
