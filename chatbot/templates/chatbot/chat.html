{% extends 'index.html' %}



{% block blockname %}
<section class="messages" id="messages">
    {% for message in messages %}
    <div class="message {{message.role}}-message">
        <br />
        {{message.text|safe}}
        <span class="message-time">{{message.created|date:"Y/m/d H:i"}}</span>
    </div>
    {% endfor %}

</section>

<form class="chat-form" id="chatForm" method="post" action="{% url 'chat' %}">
    {% csrf_token %}

    <input
        type="text"
        name="text"
        id="chatInput"
        class="chat-input"
        placeholder="پیام خود را بنویسید..."
        autocomplete="off"
        required
    />

    <button type="submit" class="send-button">➤</button>
</form>

{% endblock blockname %}
